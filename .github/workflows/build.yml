
name: Build WaosFNF Forge 1.20.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build WaosFNF
        run: gradle --no-daemon build

      - name: Upload WaosFNF JAR
        uses: actions/upload-artifact@v4
        with:
          name: WaosFNF-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
